# AWS only. Mirrors deploy/ecs-task-definition.json for running the image on an
# AWS host (EC2 or similar) whose IAM role can read the secret and send via SES.
# Run from the repo root with:
#   AWS_REGION=us-east-1 GIT_SHA=$(git rev-parse HEAD) \
#     docker compose -f docker/docker-compose-prod.yml up -d --build
#
# No database here: DATABASE_URL (RDS) and every other value come from the
# Secrets Manager bundle named by AWS_SECRETS_NAME. Nothing is read from .env.
services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    image: management-api:latest
    container_name: management_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      ENV: prod
      AWS_REGION: ${AWS_REGION:?AWS_REGION must be set}
      AWS_SECRETS_NAME: ${AWS_SECRETS_NAME:-management/prod}
      DB_SSL: require
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
